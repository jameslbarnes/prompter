<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Cancelled - AI Interview Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-white rounded-lg shadow-sm border p-8 text-center">
            <!-- Cancel Icon -->
            <div class="mb-6">
                <svg class="w-16 h-16 text-gray-400 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Purchase Cancelled</h1>
            <p class="text-gray-600 mb-6">Your purchase was cancelled and you were not charged.</p>
            
            <div class="bg-blue-50 rounded-lg p-4 mb-6">
                <p class="text-blue-700 text-sm">
                    Need more interviews? You can purchase additional credits anytime from your dashboard or the pricing page.
                </p>
            </div>
            
            <div class="space-y-3">
                <a href="/pricing.html" class="block w-full bg-blue-500 text-white py-3 px-4 rounded-lg hover:bg-blue-600 transition-colors">
                    View Pricing Options
                </a>
                <a href="/admin.html" class="block w-full bg-gray-200 text-gray-700 py-3 px-4 rounded-lg hover:bg-gray-300 transition-colors">
                    Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</body>
</html>
